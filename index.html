<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mib — Mind in Bits</title>
<style>
:root{--bg:#0c0e11;--card:#12161b;--line:#28313b;--text:#f5f7fa;--muted:#8f9aa7;--accent:#ff6b3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:680px;margin:auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{padding:16px;border-bottom:1px solid var(--line);font-size:28px;font-weight:900}
main{padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
input,textarea,button{font:inherit}input,textarea{width:100%;padding:13px;margin:7px 0 12px;border:1px solid var(--line);border-radius:12px;background:#0f1216;color:var(--text);font-size:16px}
textarea{min-height:100px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:white;font-weight:800}
.muted{color:var(--muted)}.hidden{display:none}.mib{padding:15px 0;border-bottom:1px solid var(--line)}.handle{color:var(--muted);font-size:14px}.body{white-space:pre-wrap;line-height:1.5;margin-top:6px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.error{color:#ff7285}.ok{color:#49d99a}
</style>
</head>
<body>
<div class="wrap">
<header>mib <span class="muted" style="font-size:12px">mind in bits</span></header>
<main>

<section id="login" class="card">
<h2>Welcome to Mib</h2>
<p class="muted">Text only. Chronological. Say something.</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<div class="row">
<button id="loginBtn">Log in</button>
<button id="signupBtn" style="background:#222932">Sign up</button>
</div>
<p id="authMsg" class="muted"></p>
</section>

<section id="onboard" class="card hidden">
<h2>Claim your handle</h2>
<input id="username" maxlength="20" placeholder="themursfrost">
<input id="displayName" maxlength="50" placeholder="Display name">
<textarea id="bio" maxlength="160" placeholder="Bio"></textarea>
<button id="saveProfile">Enter Mib</button>
<p id="profileMsg" class="muted"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<div class="row"><strong id="who"></strong><button id="logout" style="background:#222932">Log out</button></div>
<textarea id="composer" maxlength="420" placeholder="What's on your mind?"></textarea>
<div class="row"><span id="count" class="muted">0 / 420</span><button id="post">Mib it</button></div>
<p id="postMsg" class="muted"></p>
</div>
<div class="card">
<h3>Following</h3>
<div id="feed"><span class="muted">Loading…</span></div>
</div>
</section>

</main>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// STEP 1: replace these two placeholders with your Supabase values.
// The anon/public key is safe for a browser app when RLS is enabled.
// NEVER paste your database password or service_role secret here.
const SUPABASE_URL = "https://hxqanaesktrccjokpasn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X07F_BYOog6TG_p5bM4Afw_1hrA5H9k";

const configured = SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_") &&
  !SUPABASE_ANON_KEY.includes("PASTE_");

const $ = s => document.querySelector(s);
const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let me = null;

function show(id){
  ["#login","#onboard","#app"].forEach(x=>$(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

async function route(){
  if(!configured){
    $("#authMsg").textContent = "Add your Supabase Project URL and anon/public key in index.html first.";
    return;
  }
  const {data:{session}} = await supabase.auth.getSession();
  if(!session){ show("#login"); return; }

  const {data:profile} = await supabase.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(!profile){ show("#onboard"); return; }

  me = profile;
  $("#who").textContent = `${profile.display_name || profile.username} · @${profile.username}`;
  show("#app");
  await loadFeed();
}

$("#signupBtn").onclick = async ()=>{
  if(!configured) return;
  const {error,data} = await supabase.auth.signUp({
    email:$("#email").value.trim(),
    password:$("#password").value
  });
  $("#authMsg").className = error ? "error" : "ok";
  $("#authMsg").textContent = error ? error.message :
    (data.session ? "Account created." : "Account created. Check your email to confirm it, then log in.");
};

$("#loginBtn").onclick = async ()=>{
  if(!configured) return;
  const {error} = await supabase.auth.signInWithPassword({
    email:$("#email").value.trim(),
    password:$("#password").value
  });
  $("#authMsg").className = error ? "error" : "ok";
  $("#authMsg").textContent = error ? error.message : "Logged in.";
  if(!error) await route();
};

$("#saveProfile").onclick = async ()=>{
  const {data:{user}} = await supabase.auth.getUser();
  const username = $("#username").value.trim().toLowerCase().replace(/^@/,"");
  if(!/^[a-z0-9_]{3,20}$/.test(username)){
    $("#profileMsg").className="error";
    $("#profileMsg").textContent="Use 3–20 lowercase letters, numbers, or underscores.";
    return;
  }
  const {error} = await supabase.from("profiles").insert({
    id:user.id,
    username,
    display_name:$("#displayName").value.trim() || username,
    bio:$("#bio").value.trim()
  });
  $("#profileMsg").className = error ? "error" : "ok";
  $("#profileMsg").textContent = error ? (error.code==="23505" ? "That handle is taken." : error.message) : "Saved.";
  if(!error) await route();
};

$("#composer").oninput = ()=> $("#count").textContent = `${$("#composer").value.length} / 420`;

$("#post").onclick = async ()=>{
  const body = $("#composer").value.trim();
  if(!body) return;
  const {error} = await supabase.from("mibs").insert({author_id:me.id,body});
  $("#postMsg").className = error ? "error" : "ok";
  $("#postMsg").textContent = error ? error.message : "Mibbed.";
  if(!error){ $("#composer").value=""; $("#count").textContent="0 / 420"; await loadFeed(); }
};

async function loadFeed(){
  const {data:follows} = await supabase.from("follows").select("following_id").eq("follower_id",me.id);
  const ids = [me.id,...(follows||[]).map(x=>x.following_id)];
  const {data,error} = await supabase
    .from("mibs")
    .select("id,body,created_at,author_id,profiles!mibs_author_id_fkey(username,display_name)")
    .in("author_id",ids)
    .is("reply_to",null)
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){ $("#feed").textContent=error.message; return; }
  $("#feed").innerHTML = (data||[]).length ? data.map(m=>{
    const p=m.profiles||{};
    return `<div class="mib"><strong>${escapeHtml(p.display_name||p.username||"Mibber")}</strong>
      <span class="handle">@${escapeHtml(p.username||"unknown")}</span>
      <div class="body">${escapeHtml(m.body)}</div></div>`;
  }).join("") : '<span class="muted">No mibs yet. Be the first.</span>';
}

function escapeHtml(s=""){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

$("#logout").onclick = async ()=>{ await supabase.auth.signOut(); me=null; await route(); };
if(configured) supabase.auth.onAuthStateChange(()=>route());
route();
</script>
</body>
</html>
