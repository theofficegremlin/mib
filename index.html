<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Mib — Mind in Bits</title>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--line:#29323d;--text:#f5f7fa;--muted:#8f9aa8;--accent:#ff6b3d;--gold:#ffd166;--danger:#ff6577;--ok:#46d69a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.shell{max-width:720px;margin:auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.topbar{position:sticky;top:0;z-index:10;background:rgba(11,13,16,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:30px;font-weight:950;letter-spacing:-1.5px}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.4px;margin-left:5px}
.nav{display:flex;gap:3px}
.nav button,.ghost,.action{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:10px 11px}
.nav button.active,.nav button:hover,.ghost:hover{background:var(--panel2);color:var(--text)}
.primary{border:0;background:var(--accent);color:#fff;font-weight:850;border-radius:12px;padding:11px 16px}
.primary:disabled{opacity:.5}
.danger{color:var(--danger)}
.view{display:none}
.view.active{display:block}
.card{border-bottom:1px solid var(--line);padding:16px}
.auth{padding:30px 18px}
.hero{margin:10px 0 24px}
.hero h1{font-size:42px;line-height:1;margin:0 0 12px;letter-spacing:-1.8px}
.hero p{color:var(--muted);font-size:17px;line-height:1.5}
label{display:block;color:var(--muted);font-size:13px;margin:13px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:13px 14px;outline:none;font-size:16px}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
.auth-actions{display:flex;gap:8px;margin-top:15px}
.auth-actions button{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.status{margin-top:10px;color:var(--muted);font-size:14px}
.error{color:var(--danger)}
.ok{color:var(--ok)}
.composer textarea{border:0;background:transparent;padding:4px 0;min-height:105px;font-size:20px}
.composerbar{border-top:1px solid var(--line);padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-title{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:850}
.mib{padding:15px 16px;border-bottom:1px solid var(--line)}
.mib:hover{background:#0f1216}
.meta{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.name{font-weight:850}
.handle,.time{color:var(--muted);font-size:14px}
.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:17px;margin:7px 0 9px}
.actions{display:flex;justify-content:space-between;max-width:430px}
.action{padding:8px 10px}
.action.on{color:var(--gold)}
.reply-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.search-wrap{padding:14px 16px;border-bottom:1px solid var(--line)}
.person{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-weight:900;background:linear-gradient(135deg,var(--accent),#675cff)}
.person-main{min-width:0;flex:1}
.bio{color:var(--muted);font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.follow{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:9px 13px;font-weight:750}
.follow.on{background:var(--text);color:var(--bg)}
.profile-head{padding:22px 16px;border-bottom:1px solid var(--line)}
.profile-head .avatar{width:76px;height:76px;font-size:24px;margin-bottom:12px}
.profile-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.stats{display:flex;gap:18px;margin-top:14px;color:var(--muted);font-size:14px}
.stats b{color:var(--text)}
.tags{display:flex;gap:7px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.tag{border:1px solid var(--line);background:var(--panel);color:var(--gold);border-radius:999px;padding:8px 11px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:white;font-size:11px;font-weight:900;margin-left:3px}
.notification{display:flex;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.notification.unread{background:#11161c}
.notif-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);flex:0 0 auto}
.linkish{color:var(--gold);font-weight:750;cursor:pointer}
@media(max-width:520px){.shell{border:0}.brand small{display:none}.nav button{padding:9px 8px}.hero h1{font-size:38px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand">mib <small>mind in bits</small></div>
  <nav id="nav" class="nav" hidden>
    <button data-view="feed" class="active">Home</button>
    <button data-view="search">Search</button>
    <button data-view="notifications">Alerts<span id="notifBadge" class="badge" hidden>0</span></button>
    <button data-view="profile">Me</button>
  </nav>
</header>

<main>
<section id="loginView" class="view active auth">
  <div class="hero">
    <h1>Say something.<br>That’s it.</h1>
    <p>Text-only social. A chronological feed. No photos, no video, no mystery algorithm.</p>
  </div>
  <label>Email</label>
  <input id="email" type="email" autocomplete="email">
  <label>Password</label>
  <input id="password" type="password" minlength="6" autocomplete="current-password">
  <div class="auth-actions">
    <button id="loginBtn" class="primary">Log in</button>
    <button id="signupBtn" class="ghost" style="border:1px solid var(--line)">Sign up</button>
  </div>
  <div id="authMsg" class="status"></div>
</section>

<section id="onboardView" class="view auth">
  <div class="hero">
    <h1>Claim your handle.</h1>
    <p>This is how people will find you on Mib.</p>
  </div>
  <label>@handle</label>
  <input id="username" maxlength="20" placeholder="themursfrost">
  <label>Display name</label>
  <input id="displayName" maxlength="50" placeholder="Murs">
  <label>Bio</label>
  <textarea id="bio" maxlength="160" rows="4" placeholder="A few words about you."></textarea>
  <button id="saveProfile" class="primary" style="width:100%;margin-top:15px">Enter Mib</button>
  <div id="profileMsg" class="status"></div>
</section>

<section id="feedView" class="view">
  <div class="card composer">
    <textarea id="composer" maxlength="420" placeholder="What's on your mind?"></textarea>
    <div class="composerbar">
      <span id="count" class="muted small">0 / 420</span>
      <button id="postBtn" class="primary">Mib it</button>
    </div>
    <div id="postMsg" class="status"></div>
  </div>
  <div class="section-title">Following</div>
  <div id="feed"></div>
</section>

<section id="searchView" class="view">
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="Search people, @handles, posts, or #hashtags">
  </div>
  <div id="tagResults"></div>
  <div id="searchResults"><div class="empty">Search Mib.</div></div>
</section>

<section id="notificationsView" class="view">
  <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
    <span>Notifications</span>
    <button id="markAllRead" class="ghost">Mark all read</button>
  </div>
  <div id="notificationsList"><div class="empty">Loading…</div></div>
</section>

<section id="profileView" class="view">
  <div id="profileHead"></div>
  <div class="section-title">Mibs</div>
  <div id="profileMibs"></div>
</section>
</main>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://hxqanaesktrccjokpasn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X07F_BYOog6TG_p5bM4Afw_1hrA5H9k";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = function(s){ return document.querySelector(s); };
const $$ = function(s){ return Array.from(document.querySelectorAll(s)); };
let session = null;
let me = null;
let activeProfileId = null;

function escapeHtml(s){
  return String(s || "").replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function initials(name){
  return String(name || "M").split(/\s+/).map(function(x){return x[0] || "";}).join("").slice(0,2).toUpperCase();
}
function timeAgo(iso){
  var d = new Date(iso);
  var sec = Math.max(1,Math.floor((Date.now()-d.getTime())/1000));
  if(sec < 60) return sec + "s";
  if(sec < 3600) return Math.floor(sec/60) + "m";
  if(sec < 86400) return Math.floor(sec/3600) + "h";
  return d.toLocaleDateString();
}
function formatBody(body){
  var safe=escapeHtml(body);
  safe=safe.replace(/(^|\s)(#[A-Za-z0-9_]+)/g,'$1<span class="linkish tagLink" data-tag="$2">$2</span>');
  safe=safe.replace(/(^|\s)(@[A-Za-z0-9_]{3,20})/g,'$1<span class="linkish mentionLink" data-handle="$2">$2</span>');
  return safe;
}
function show(id){
  $$(".view").forEach(function(v){v.classList.remove("active");});
  $(id).classList.add("active");
}
function setNav(name){
  $$("#nav button").forEach(function(b){b.classList.toggle("active",b.dataset.view===name);});
}
async function boot(){
  var res = await supabase.auth.getSession();
  session = res.data.session;
  await route();
  supabase.auth.onAuthStateChange(async function(_event,next){
    session = next;
    await route();
  });
}
async function route(){
  if(!session){
    me = null;
    $("#nav").hidden = true;
    show("#loginView");
    return;
  }
  var p = await supabase.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(p.error){
    $("#authMsg").className = "status error";
    $("#authMsg").textContent = p.error.message;
    return;
  }
  if(!p.data){
    $("#nav").hidden = true;
    show("#onboardView");
    return;
  }
  me = p.data;
  $("#nav").hidden = false;
  show("#feedView");
  setNav("feed");
  await loadFeed();
  await updateNotificationBadge();
}

$("#loginBtn").onclick = async function(){
  var r = await supabase.auth.signInWithPassword({
    email:$("#email").value.trim(),
    password:$("#password").value
  });
  $("#authMsg").className = r.error ? "status error" : "status ok";
  $("#authMsg").textContent = r.error ? r.error.message : "Logged in.";
  if(!r.error) await route();
};
$("#signupBtn").onclick = async function(){
  var r = await supabase.auth.signUp({
    email:$("#email").value.trim(),
    password:$("#password").value
  });
  $("#authMsg").className = r.error ? "status error" : "status ok";
  $("#authMsg").textContent = r.error ? r.error.message :
    (r.data.session ? "Account created." : "Account created. Check your email to confirm it, then log in.");
};
$("#saveProfile").onclick = async function(){
  var u = await supabase.auth.getUser();
  var username = $("#username").value.trim().toLowerCase().replace(/^@/,"");
  if(!/^[a-z0-9_]{3,20}$/.test(username)){
    $("#profileMsg").className="status error";
    $("#profileMsg").textContent="Use 3–20 lowercase letters, numbers, or underscores.";
    return;
  }
  var r = await supabase.from("profiles").insert({
    id:u.data.user.id,
    username:username,
    display_name:$("#displayName").value.trim() || username,
    bio:$("#bio").value.trim()
  });
  $("#profileMsg").className = r.error ? "status error" : "status ok";
  $("#profileMsg").textContent = r.error ? (r.error.code==="23505" ? "That handle is taken." : r.error.message) : "Saved.";
  if(!r.error) await route();
};

$$("#nav button").forEach(function(btn){
  btn.onclick = async function(){
    var v = btn.dataset.view;
    setNav(v);
    if(v==="feed"){show("#feedView");await loadFeed();}
    if(v==="search"){show("#searchView");$("#searchInput").focus();}
    if(v==="notifications"){show("#notificationsView");await loadNotifications();}
    if(v==="profile"){show("#profileView");await loadProfile(me.id);}
  };
});

$("#composer").oninput = function(){
  $("#count").textContent = $("#composer").value.length + " / 420";
};
$("#postBtn").onclick = async function(){
  var body = $("#composer").value.trim();
  if(!body) return;
  $("#postBtn").disabled = true;
  var r = await supabase.from("mibs").insert({author_id:me.id,body:body});
  $("#postBtn").disabled = false;
  $("#postMsg").className = r.error ? "status error" : "status ok";
  $("#postMsg").textContent = r.error ? r.error.message : "Mibbed.";
  if(!r.error){
    $("#composer").value="";
    $("#count").textContent="0 / 420";
    await loadFeed();
  }
};

async function getFollowingIds(){
  var r = await supabase.from("follows").select("following_id").eq("follower_id",me.id);
  if(r.error) return [me.id];
  return [me.id].concat((r.data || []).map(function(x){return x.following_id;}));
}
async function getCounts(ids){
  var out={};
  ids.forEach(function(id){out[id]={likes:0,remibs:0,replies:0,liked:false,remibbed:false};});
  if(!ids.length) return out;
  var results = await Promise.all([
    supabase.from("likes").select("mib_id,user_id").in("mib_id",ids),
    supabase.from("remibs").select("mib_id,user_id").in("mib_id",ids),
    supabase.from("mibs").select("reply_to").in("reply_to",ids)
  ]);
  (results[0].data || []).forEach(function(x){
    if(out[x.mib_id]){out[x.mib_id].likes++;if(x.user_id===me.id)out[x.mib_id].liked=true;}
  });
  (results[1].data || []).forEach(function(x){
    if(out[x.mib_id]){out[x.mib_id].remibs++;if(x.user_id===me.id)out[x.mib_id].remibbed=true;}
  });
  (results[2].data || []).forEach(function(x){
    if(out[x.reply_to])out[x.reply_to].replies++;
  });
  return out;
}
async function renderMibs(container,mibs){
  if(!mibs.length){
    container.innerHTML='<div class="empty">Nothing here yet.</div>';
    return;
  }
  var counts = await getCounts(mibs.map(function(m){return m.id;}));
  container.innerHTML = mibs.map(function(m){
    var p=m.profiles || {};
    var c=counts[m.id] || {};
    return '<article class="mib">' +
      (m.reply_to ? '<div class="reply-label">Reply</div>' : '') +
      '<div class="meta">' +
      '<button class="ghost profileLink" data-user="'+m.author_id+'" style="padding:0"><span class="name">'+escapeHtml(p.display_name || p.username || "Mibber")+'</span></button>' +
      '<span class="handle">@'+escapeHtml(p.username || "unknown")+'</span>' +
      '<span class="time">· '+timeAgo(m.created_at)+'</span>' +
      '</div>' +
      '<div class="body">'+formatBody(m.body)+'</div>' +
      '<div class="actions">' +
      '<button class="action replyBtn" data-id="'+m.id+'" data-handle="'+escapeHtml(p.username || "")+'">↩ '+(c.replies || "")+'</button>' +
      '<button class="action remibBtn '+(c.remibbed ? "on" : "")+'" data-id="'+m.id+'">⟳ '+(c.remibs || "")+'</button>' +
      '<button class="action likeBtn '+(c.liked ? "on" : "")+'" data-id="'+m.id+'">♥ '+(c.likes || "")+'</button>' +
      '</div></article>';
  }).join("");

  container.querySelectorAll(".likeBtn").forEach(function(b){
    b.onclick=function(){toggleLike(Number(b.dataset.id),b.classList.contains("on"));};
  });
  container.querySelectorAll(".remibBtn").forEach(function(b){
    b.onclick=function(){toggleRemib(Number(b.dataset.id),b.classList.contains("on"));};
  });
  container.querySelectorAll(".replyBtn").forEach(function(b){
    b.onclick=function(){replyTo(Number(b.dataset.id),b.dataset.handle);};
  });
  container.querySelectorAll(".profileLink").forEach(function(b){
    b.onclick=async function(){show("#profileView");setNav("profile");await loadProfile(b.dataset.user);};
  });
  container.querySelectorAll(".mentionLink").forEach(function(el){
    el.onclick=async function(){
      var handle=el.dataset.handle.replace(/^@/,"").toLowerCase();
      var r=await supabase.from("profiles").select("id").eq("username",handle).maybeSingle();
      if(r.data){show("#profileView");setNav("profile");await loadProfile(r.data.id);}
    };
  });
  container.querySelectorAll(".tagLink").forEach(function(el){
    el.onclick=async function(){
      show("#searchView");setNav("search");
      $("#searchInput").value=el.dataset.tag;
      await runSearch();
    };
  });
}
async function loadFeed(){
  $("#feed").innerHTML='<div class="empty">Loading…</div>';
  var ids=await getFollowingIds();
  var r=await supabase.from("mibs")
    .select("id,author_id,body,reply_to,created_at,profiles!mibs_author_id_fkey(username,display_name)")
    .in("author_id",ids)
    .is("reply_to",null)
    .order("created_at",{ascending:false})
    .limit(100);
  if(r.error){$("#feed").innerHTML='<div class="empty">'+escapeHtml(r.error.message)+'</div>';return;}
  await renderMibs($("#feed"),r.data || []);
}
async function toggleLike(mibId,on){
  if(on) await supabase.from("likes").delete().eq("user_id",me.id).eq("mib_id",mibId);
  else await supabase.from("likes").insert({user_id:me.id,mib_id:mibId});
  await refreshCurrent();
}
async function toggleRemib(mibId,on){
  if(on) await supabase.from("remibs").delete().eq("user_id",me.id).eq("mib_id",mibId);
  else await supabase.from("remibs").insert({user_id:me.id,mib_id:mibId});
  await refreshCurrent();
}
async function replyTo(mibId,handle){
  var body=window.prompt("Reply to @"+handle+":");
  if(!body || !body.trim()) return;
  var r=await supabase.from("mibs").insert({author_id:me.id,body:body.trim().slice(0,420),reply_to:mibId});
  if(r.error) window.alert(r.error.message);
  else await refreshCurrent();
}
async function refreshCurrent(){
  if($("#feedView").classList.contains("active")) await loadFeed();
  else if($("#profileView").classList.contains("active")) await loadProfile(activeProfileId || me.id);
  else if($("#searchView").classList.contains("active")) await runSearch();
}


async function updateNotificationBadge(){
  if(!me) return;
  var r=await supabase.from("notifications")
    .select("*",{count:"exact",head:true})
    .eq("user_id",me.id)
    .is("read_at",null);
  var n=r.count || 0;
  $("#notifBadge").hidden = n===0;
  $("#notifBadge").textContent = n>99 ? "99+" : String(n);
}

function notificationText(type){
  if(type==="like") return "liked your mib";
  if(type==="reply") return "replied to your mib";
  if(type==="follow") return "followed you";
  if(type==="remib") return "remibbed your mib";
  if(type==="mention") return "mentioned you";
  return "interacted with you";
}

function notificationIcon(type){
  if(type==="like") return "♥";
  if(type==="reply") return "↩";
  if(type==="follow") return "+";
  if(type==="remib") return "⟳";
  if(type==="mention") return "@";
  return "•";
}

async function loadNotifications(){
  $("#notificationsList").innerHTML='<div class="empty">Loading…</div>';
  var r=await supabase.from("notifications")
    .select("id,type,mib_id,actor_id,created_at,read_at,profiles!notifications_actor_id_fkey(username,display_name)")
    .eq("user_id",me.id)
    .order("created_at",{ascending:false})
    .limit(100);

  if(r.error){
    $("#notificationsList").innerHTML='<div class="empty">'+escapeHtml(r.error.message)+'</div>';
    return;
  }

  var rows=r.data || [];
  if(!rows.length){
    $("#notificationsList").innerHTML='<div class="empty">No notifications yet.</div>';
  }else{
    $("#notificationsList").innerHTML=rows.map(function(n){
      var p=n.profiles || {};
      return '<div class="notification '+(!n.read_at ? "unread" : "")+'" data-actor="'+n.actor_id+'">' +
        '<div class="notif-icon">'+notificationIcon(n.type)+'</div>' +
        '<div style="min-width:0;flex:1">' +
          '<div><strong>'+escapeHtml(p.display_name || p.username || "Someone")+'</strong> '+
          '<span class="muted">@'+escapeHtml(p.username || "unknown")+'</span> '+
          notificationText(n.type)+'</div>' +
          '<div class="muted small" style="margin-top:4px">'+timeAgo(n.created_at)+'</div>' +
        '</div></div>';
    }).join("");

    $("#notificationsList").querySelectorAll(".notification").forEach(function(row){
      row.onclick=async function(){
        show("#profileView");setNav("profile");
        await loadProfile(row.dataset.actor);
      };
    });
  }

  var unread=rows.filter(function(x){return !x.read_at;}).map(function(x){return x.id;});
  if(unread.length){
    await supabase.from("notifications")
      .update({read_at:new Date().toISOString()})
      .in("id",unread)
      .eq("user_id",me.id);
  }
  await updateNotificationBadge();
}

$("#markAllRead").onclick=async function(){
  await supabase.from("notifications")
    .update({read_at:new Date().toISOString()})
    .eq("user_id",me.id)
    .is("read_at",null);
  await loadNotifications();
};

var searchTimer=null;
$("#searchInput").oninput=function(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(runSearch,220);
};
async function runSearch(){
  var q=$("#searchInput").value.trim();
  var out=$("#searchResults");
  var tags=$("#tagResults");
  if(!q){
    tags.innerHTML="";
    out.innerHTML='<div class="empty">Search Mib.</div>';
    return;
  }
  out.innerHTML='<div class="empty">Searching…</div>';
  var clean=q.replace(/^[@#]/,"").replace(/[,()%]/g,"");
  var people=await supabase.from("profiles").select("*").or("username.ilike.%"+clean+"%,display_name.ilike.%"+clean+"%").limit(20);
  var posts=await supabase.from("mibs")
    .select("id,author_id,body,reply_to,created_at,profiles!mibs_author_id_fkey(username,display_name)")
    .ilike("body","%"+q+"%")
    .order("created_at",{ascending:false})
    .limit(30);
  var following=await getFollowingIds();
  var followingSet=new Set(following);

  var tagMap={};
  (posts.data || []).forEach(function(m){
    var found=m.body.match(/#[A-Za-z0-9_]+/g) || [];
    found.forEach(function(t){tagMap[t.toLowerCase()]=(tagMap[t.toLowerCase()] || 0)+1;});
  });
  var tagEntries=Object.entries(tagMap).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  tags.innerHTML=tagEntries.length ? '<div class="tags">'+tagEntries.map(function(t){
    return '<button class="tag" data-tag="'+escapeHtml(t[0])+'">'+escapeHtml(t[0])+' · '+t[1]+'</button>';
  }).join("")+'</div>' : "";
  tags.querySelectorAll(".tag").forEach(function(b){
    b.onclick=function(){$("#searchInput").value=b.dataset.tag;runSearch();};
  });

  var html='<div class="section-title">People</div>';
  if((people.data || []).length){
    html+=(people.data || []).map(function(p){
      var isMe=p.id===me.id;
      var isFollowing=followingSet.has(p.id);
      return '<div class="person" data-user="'+p.id+'">' +
        '<div class="avatar">'+initials(p.display_name || p.username)+'</div>' +
        '<div class="person-main"><div class="name">'+escapeHtml(p.display_name || p.username)+'</div>' +
        '<div class="handle">@'+escapeHtml(p.username)+'</div><div class="bio">'+escapeHtml(p.bio || "")+'</div></div>' +
        (isMe ? '<span class="muted small">You</span>' : '<button class="follow '+(isFollowing ? "on" : "")+'" data-user="'+p.id+'">'+(isFollowing ? "Following" : "Follow")+'</button>') +
        '</div>';
    }).join("");
  } else html+='<div class="empty">No people found.</div>';
  html+='<div class="section-title">Posts</div><div id="searchPosts"></div>';
  out.innerHTML=html;

  out.querySelectorAll(".follow").forEach(function(b){
    b.onclick=async function(e){e.stopPropagation();await toggleFollow(b.dataset.user,b.classList.contains("on"));await runSearch();};
  });
  out.querySelectorAll(".person").forEach(function(row){
    row.onclick=async function(e){
      if(e.target.closest(".follow")) return;
      show("#profileView");setNav("profile");await loadProfile(row.dataset.user);
    };
  });
  await renderMibs($("#searchPosts"),posts.data || []);
}
async function toggleFollow(userId,on){
  if(on) await supabase.from("follows").delete().eq("follower_id",me.id).eq("following_id",userId);
  else await supabase.from("follows").insert({follower_id:me.id,following_id:userId});
}

async function loadProfile(userId){
  activeProfileId=userId;
  $("#profileHead").innerHTML='<div class="empty">Loading…</div>';
  $("#profileMibs").innerHTML="";
  var results=await Promise.all([
    supabase.from("profiles").select("*").eq("id",userId).single(),
    supabase.from("mibs").select("id,author_id,body,reply_to,created_at,profiles!mibs_author_id_fkey(username,display_name)").eq("author_id",userId).is("reply_to",null).order("created_at",{ascending:false}),
    supabase.from("follows").select("*",{count:"exact",head:true}).eq("following_id",userId),
    supabase.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",userId),
    supabase.from("mibs").select("id").eq("author_id",userId)
  ]);
  var p=results[0].data;
  if(results[0].error){$("#profileHead").innerHTML='<div class="empty">'+escapeHtml(results[0].error.message)+'</div>';return;}
  var followers=results[2].count || 0;
  var following=results[3].count || 0;
  var allMibIds=(results[4].data || []).map(function(x){return x.id;});
  var totalLikes=0;
  if(allMibIds.length){
    var likeCount=await supabase.from("likes").select("*",{count:"exact",head:true}).in("mib_id",allMibIds);
    totalLikes=likeCount.count || 0;
  }
  var control="";
  if(userId===me.id){
    control='<button id="logoutBtn" class="ghost danger">Log out</button>';
  }else{
    var f=await supabase.from("follows").select("following_id").eq("follower_id",me.id).eq("following_id",userId).maybeSingle();
    control='<button id="profileFollowBtn" class="follow '+(f.data ? "on" : "")+'">'+(f.data ? "Following" : "Follow")+'</button>';
  }
  $("#profileHead").innerHTML='<div class="profile-head">' +
    '<div class="avatar">'+initials(p.display_name || p.username)+'</div>' +
    '<div class="profile-row"><div><div class="name" style="font-size:22px">'+escapeHtml(p.display_name || p.username)+'</div>' +
    '<div class="handle">@'+escapeHtml(p.username)+'</div></div>'+control+'</div>' +
    '<div style="margin-top:12px;line-height:1.5">'+escapeHtml(p.bio || "")+'</div>' +
    '<div class="stats"><span><b>'+followers+'</b> followers</span><span><b>'+following+'</b> following</span><span><b>'+totalLikes+'</b> likes</span></div></div>';

  if(userId===me.id){
    $("#logoutBtn").onclick=async function(){await supabase.auth.signOut();};
  }else{
    $("#profileFollowBtn").onclick=async function(){
      await toggleFollow(userId,$("#profileFollowBtn").classList.contains("on"));
      await loadProfile(userId);
    };
  }
  await renderMibs($("#profileMibs"),results[1].data || []);
}

boot();
</script>
</body>
</html>
